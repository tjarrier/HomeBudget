# Nom de projet fixe : sans lui, chaque worktree (dossier different) devient un
# projet Compose distinct qui se dispute le `container_name` global homebudget-db
# et se heurte a « container name already in use ». Fige, ils partagent tous le
# meme conteneur et le meme volume.
name: homebudget

services:
  postgres:
    image: postgres:17-alpine
    container_name: homebudget-db
    environment:
      POSTGRES_USER: homebudget
      POSTGRES_PASSWORD: homebudget
      POSTGRES_DB: homebudget
    ports:
      # 5433 pour ne pas entrer en conflit avec un Postgres deja installe.
      - '5433:5432'
    volumes:
      - homebudget-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U homebudget']
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  homebudget-pgdata:
