name: Deploiement production

# Une version, pas un commit. La production ne bouge que sur un tag, et le tag
# est la seule chose qui la fait bouger — `apps/web/vercel.json` a coupe les
# deploiements de l'integration Git.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

concurrency:
  group: production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Un job, et non une etape de `deploy` : un tag pose sur un commit hors `main`
  # est refuse en dix secondes, sans brûler Postgres et Playwright pour rien.
  garde:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verifier que le commit tague appartient a main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Le commit $GITHUB_SHA n'est pas un ancetre de main. Un tag pose hors de main ne part pas en production."
            exit 1
          fi

  # Un tag peut pointer un commit que la CI n'a jamais vu : on rejoue la
  # verification complete, on ne fait pas confiance a l'historique.
  verif:
    needs: garde
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: verif
    runs-on: ubuntu-latest
    # Protection par reviewer requise sur cet environment : approuver, ce n'est
    # pas seulement publier du code, c'est autoriser une migration sur la base de
    # production. La revue se place donc apres le vert de la CI et avant l'ecriture.
    environment: Production

    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Installer la CLI Vercel
        run: npm install --global vercel@latest

      - name: Tirer la configuration et les variables de Production
        working-directory: apps/web
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      # Deux sources pour une seule base : la migration utilise le secret
      # d'environment GitHub, l'application la variable du projet Vercel, que
      # `vercel build` embarque. Si elles divergent, la migration s'applique sur
      # une base et le code neuf parle a une autre — un run vert sur la mauvaise
      # base, le seul mode de defaillance que l'ordre des etapes ne rattrape pas.
      # On ne compare que ce qui identifie la base, jamais les identifiants.
      - name: Verifier que les deux DATABASE_URL designent la meme base de production
        working-directory: apps/web
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          empreinte() {
            printf '%s' "$1" | sed -e 's|^[a-z+]*://||' -e 's|^.*@||' -e 's|?.*$||' -e 's|:[0-9]*/|/|'
          }
          servie=$(grep -m1 '^DATABASE_URL=' .vercel/.env.production.local | cut -d= -f2- | tr -d '"' || true)
          if [ -z "$servie" ]; then
            echo "::error::DATABASE_URL est absente de l'environnement Production du projet Vercel."
            exit 1
          fi
          if [ "$(empreinte "$DATABASE_URL")" != "$(empreinte "$servie")" ]; then
            echo "::error::Les deux DATABASE_URL ne designent pas la meme base : la migration viserait $(empreinte "$DATABASE_URL"), l'application est servie par $(empreinte "$servie"). Si l'application utilise volontairement le pooler Supabase et la migration la connexion directe, les empreintes different legitimement : adaptez ce controle plutot que de le retirer."
            exit 1
          fi

      - name: Construire
        working-directory: apps/web
        run: vercel build --prod --token="$VERCEL_TOKEN"

      # L'ordre n'est pas negociable : rien ne s'ecrit sur la base avant qu'un
      # artefact existe, et la migration precede toujours la promotion, afin que le
      # code neuf ne parle jamais a un schema vieux. Le seul chemin autorise est
      # `db:migrate` ; tout outil qui comparerait le schema TS a la base et
      # proposerait de supprimer nos garde-fous y est formellement interdit.
      - name: Migrer la base de production
        run: pnpm --filter @homebudget/db db:migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Promouvoir
        working-directory: apps/web
        env:
          REF: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          url=$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")
          {
            echo "## Production promue"
            echo
            echo "- Version : \`$REF\`"
            echo "- Commit : \`$SHA\`"
            echo "- Deploiement : $url"
          } >> "$GITHUB_STEP_SUMMARY"
