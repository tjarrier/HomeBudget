name: Deploiement production

# Une version, pas un commit. La production ne bouge que sur un tag, et le tag
# est la seule chose qui la fait bouger — `apps/web/vercel.json` a coupe les
# deploiements de l'integration Git.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

concurrency:
  group: production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Un job, et non une etape de `deploy` : un tag pose sur un commit hors `main`
  # est refuse en dix secondes, sans brûler Postgres et Playwright pour rien.
  garde:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verifier que le commit tague appartient a main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Le commit $GITHUB_SHA n'est pas un ancetre de main. Un tag pose hors de main ne part pas en production."
            exit 1
          fi

  # Un tag peut pointer un commit que la CI n'a jamais vu : on rejoue la
  # verification complete, on ne fait pas confiance a l'historique.
  verif:
    needs: garde
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: verif
    runs-on: ubuntu-latest
    # Protection par reviewer requise sur cet environment : approuver, ce n'est
    # pas seulement publier du code, c'est autoriser une migration sur la base de
    # production. La revue se place donc apres le vert de la CI et avant l'ecriture.
    environment: Production

    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Installer la CLI Vercel
        run: npm install --global vercel@latest

      # La CLI tourne a la racine du depot, et non dans `apps/web` : le Root
      # Directory du projet vaut `apps/web`, et la CLI le *joint* au repertoire
      # courant. Lancee depuis `apps/web`, elle cherche `apps/web/apps/web`.
      # `vercel build` s'en tire par un repli assorti d'un avertissement,
      # `vercel deploy --prebuilt` echoue net. Tout ce que la CLI ecrit —
      # `.vercel/project.json`, le fichier d'environnement, `.vercel/output` —
      # atterrit donc a la racine, et les etapes qui le lisent aussi.
      - name: Tirer la configuration et les variables de Production
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      # Il n'y a plus deux sources pour une seule base. Le secret d'environment
      # GitHub est la seule, et cette etape la recopie dans le projet Vercel, que
      # `vercel deploy` capture en creant le deploiement. La migration et
      # l'application ne peuvent plus viser deux bases differentes — par
      # construction, et non plus par verification.
      #
      # Une verification vivait ici, et elle ne pouvait pas fonctionner :
      # `DATABASE_URL` est marquee *Sensitive* cote Vercel, donc `vercel pull` en
      # ecrit la chaine `[SENSITIVE]` et jamais la valeur. Elle comparait une
      # empreinte reelle a une constante, et echouait a chaque run.
      #
      # On passe par l'API, et non par `vercel env add`. La CLI a tourne sur la
      # preview et n'a rien ecrit : malgre `--yes`, elle demande une branche git,
      # le pipe lui donne EOF, elle abandonne — et sort en 0. L'etape s'est
      # declaree verte pendant que l'application parlait a l'ancienne base. Le
      # code HTTP est verifie pour cette raison : une commande peut mentir.
      #
      # `upsert=true` ecrase en une seule operation : un DELETE puis un POST
      # laisserait l'application sans base si le run mourait entre les deux.
      # `type: sensitive` preserve la protection de la valeur, qui passe par
      # stdin et jamais par la ligne de commande.
      #
      # Le corps de la reponse n'est jamais affiche : il contient la valeur. Seul
      # le code d'erreur en est extrait.
      - name: Aligner DATABASE_URL sur le secret GitHub
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL est absente de l'environment Production du depot. Sans elle, cette etape effacerait la base que sert l'application."
            exit 1
          fi
          code=$(jq -n --arg v "$DATABASE_URL" \
              '{key:"DATABASE_URL", value:$v, type:"sensitive", target:["production"]}' \
            | curl -sS -o reponse.json -w '%{http_code}' -X POST \
                "https://api.vercel.com/v10/projects/$VERCEL_PROJECT_ID/env?upsert=true&teamId=$VERCEL_ORG_ID" \
                -H "Authorization: Bearer $VERCEL_TOKEN" \
                -H 'Content-Type: application/json' \
                --data @-)
          if [ "$code" != "200" ] && [ "$code" != "201" ]; then
            echo "::error::l'ecriture de DATABASE_URL dans le projet Vercel a repondu $code ($(jq -r '.error.code // "sans code"' reponse.json)). L'application viserait une autre base que la migration."
            exit 1
          fi
          rm -f reponse.json

      - name: Construire
        run: vercel build --prod --token="$VERCEL_TOKEN"

      # L'ordre n'est pas negociable : rien ne s'ecrit sur la base avant qu'un
      # artefact existe, et la migration precede toujours la promotion, afin que le
      # code neuf ne parle jamais a un schema vieux. Le seul chemin autorise est
      # `db:migrate` ; tout outil qui comparerait le schema TS a la base et
      # proposerait de supprimer nos garde-fous y est formellement interdit.
      - name: Migrer la base de production
        run: pnpm --filter @homebudget/db db:migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Promouvoir
        env:
          REF: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          url=$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")
          {
            echo "## Production promue"
            echo
            echo "- Version : \`$REF\`"
            echo "- Commit : \`$SHA\`"
            echo "- Deploiement : $url"
          } >> "$GITHUB_STEP_SUMMARY"
