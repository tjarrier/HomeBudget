name: CI

# Pousser suffit a lancer la verification : sur n'importe quelle branche, PR
# ouverte ou pas. Toutes, sauf `main` — la, c'est `deploy-preview.yml` qui appelle
# la CI, et sur un tag `deploy-production.yml` : un seul run, un seul verdict, et
# il est relie au deploiement qu'il autorise. Reautoriser `main` ici ferait tourner
# deux fois Postgres et Playwright a chaque merge, pour deux verdicts qu'il faudrait
# ensuite comparer.
#
# Pas de `pull_request` non plus, pour la meme raison : il rejouerait le meme commit
# une seconde fois a chaque push d'une branche du depot. Le run declenche par le push
# s'affiche deja dans les checks de la PR — c'est le meme SHA. Contrepartie assumee :
# la CI verifie le commit de la branche et non sa fusion avec `main`, et une PR
# ouverte depuis un fork ne serait pas verifiee du tout.
on:
  push:
    branches-ignore: [main]
  workflow_call:

jobs:
  qualite:
    runs-on: ubuntu-latest

    # Les invariants I1 et I2 ne sont PAS des `if` : ce sont un EXCLUDE, des CHECK et
    # des triggers, qui ne s'executent que dans Postgres. Sans ce service, une CI verte
    # ne prouvait rien sur `0001`..`0003` — le coeur du projet n'etait exerce qu'a la
    # main, en local.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: homebudget
          POSTGRES_PASSWORD: homebudget
          POSTGRES_DB: homebudget
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U homebudget"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15

    env:
      DATABASE_URL: postgresql://homebudget:homebudget@127.0.0.1:5433/homebudget
      BETTER_AUTH_SECRET: secret-de-ci-non-sensible-32-caracteres
      BETTER_AUTH_URL: http://localhost:3000
      ALLOWLIST_THOMAS: thomas@exemple.fr
      ALLOWLIST_LIZ: liz@exemple.fr

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck

      # Le canari. S'il tombe, la PR ne passe pas : un invariant a ete viole.
      - run: pnpm test

      # Les migrations doivent s'appliquer sur une base vierge, et les garde-fous
      # qu'elles posent doivent refuser ce qu'ils sont censes refuser.
      - run: pnpm --filter @homebudget/db db:migrate
      - run: pnpm --filter @homebudget/db test:integration

      # Le seed se verifie lui-meme : il relit la base, recalcule le solde, et annule
      # tout s'il ne tombe pas exactement sur 114 580 centimes.
      - run: pnpm --filter @homebudget/db db:seed

      # L'application se construit, et les trois parcours du design v1 tournent
      # sur le seed : le canari a 114 580 centimes est verifie jusque dans l'UI.
      - run: pnpm --filter @homebudget/web build

      - run: pnpm --filter @homebudget/web exec playwright install --with-deps chromium

      - run: pnpm --filter @homebudget/web test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7
