name: Deploiement preview

# Le deployeur, et lui seul : `apps/web/vercel.json` a coupe les deploiements de
# l'integration Git. Un merge dans `main` publie ici, en preview, apres CI verte.
#
# `workflow_dispatch` n'a pas d'entree `ref` : le selecteur de branche natif de
# GitHub fait deja le travail, et une entree en plus ferait verifier une branche
# pendant qu'on en deploie une autre. Un dispatch sur une autre branche produit
# l'hote `-git-<branche>-` correspondant, qui n'est pas dans les redirect URIs de
# Google : la connexion y echouera, et c'est sans solution automatique puisque
# Google n'accepte aucun wildcard.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Pas d'annulation : `db:migrate` est la seule etape non idempotente de la
# chaine, et deux runs concurrents sur la meme base sont la seule facon de la
# corrompre. On fait la queue.
concurrency:
  group: preview
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verif:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: verif
    runs-on: ubuntu-latest
    environment: Preview

    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Installer la CLI Vercel
        run: npm install --global vercel@latest

      - name: Tirer la configuration et les variables de Preview
        working-directory: apps/web
        run: vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"

      # Sans BETTER_AUTH_URL dans l'environnement Preview du projet Vercel,
      # `next build` echoue : `origineAuth()` refuse de demarrer sur Vercel
      # plutot que de retomber sur `localhost`, et c'est voulu — cette URI est
      # enregistree chez Google, donc le tour OAuth reussirait et renverrait
      # l'utilisateur sur son propre poste, sans aucune erreur.
      #
      # Cette garde ne change pas le verdict, elle le rend lisible tout de suite
      # au lieu de deux minutes plus tard dans une stacktrace de build. Le
      # fichier tire contient aussi DATABASE_URL et GOOGLE_CLIENT_SECRET : on
      # n'en extrait que cette seule variable.
      - name: Lire l'origine annoncee a Google
        working-directory: apps/web
        run: |
          origine=$(grep -m1 '^BETTER_AUTH_URL=' .vercel/.env.preview.local | cut -d= -f2- | tr -d '"' || true)
          if [ -z "$origine" ]; then
            echo "::error::BETTER_AUTH_URL est absente de l'environnement Preview du projet Vercel. Posez-y l'URL de branche stable, la meme que le redirect URI enregistre chez Google."
            exit 1
          fi
          echo "ORIGINE=$origine" >> "$GITHUB_ENV"

      # Deux sources pour une seule base : la migration utilise le secret
      # d'environment GitHub, l'application la variable du projet Vercel, que
      # `vercel build` embarque. Si elles divergent, la migration s'applique sur
      # une base et le code neuf parle a une autre — un run vert sur la mauvaise
      # base, le seul mode de defaillance que l'ordre des etapes ne rattrape pas.
      # On ne compare que ce qui identifie la base, jamais les identifiants.
      - name: Verifier que les deux DATABASE_URL designent la meme base
        working-directory: apps/web
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          empreinte() {
            printf '%s' "$1" | sed -e 's|^[a-z+]*://||' -e 's|^[^@]*@||' -e 's|?.*$||' -e 's|:[0-9]*/|/|'
          }
          servie=$(grep -m1 '^DATABASE_URL=' .vercel/.env.preview.local | cut -d= -f2- | tr -d '"' || true)
          if [ -z "$servie" ]; then
            echo "::error::DATABASE_URL est absente de l'environnement Preview du projet Vercel."
            exit 1
          fi
          if [ "$(empreinte "$DATABASE_URL")" != "$(empreinte "$servie")" ]; then
            echo "::error::Les deux DATABASE_URL ne designent pas la meme base : la migration viserait $(empreinte "$DATABASE_URL"), l'application est servie par $(empreinte "$servie"). Si l'application utilise volontairement le pooler Supabase et la migration la connexion directe, les empreintes different legitimement : adaptez ce controle plutot que de le retirer."
            exit 1
          fi

      - name: Construire
        working-directory: apps/web
        run: vercel build --token="$VERCEL_TOKEN"

      # L'ordre n'est pas negociable : rien ne s'ecrit sur la base avant qu'un
      # artefact existe, et la migration precede toujours la promotion, afin que le
      # code neuf ne parle jamais a un schema vieux. Elle porte sur la base de
      # PREVIEW : `DATABASE_URL` vient du secret de l'environment `Preview`, qui
      # doit pointer une autre base que la production.
      - name: Migrer la base de preview
        run: pnpm --filter @homebudget/db db:migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Publier
        working-directory: apps/web
        run: |
          url=$(vercel deploy --prebuilt --token="$VERCEL_TOKEN")
          echo "URL=$url" >> "$GITHUB_ENV"

      # La verification que l'issue demande de faire pour de vrai, et non de
      # supposer : l'origine annoncee a Google d'un cote, les hotes que Vercel a
      # reellement attribues au deploiement de l'autre.
      #
      # Sur `main`, l'alias `home-budget-git-main-...` doit etre present dans
      # les hotes. Si Vercel ne l'attribue pas, le tour OAuth est casse : la
      # connexion Google renverrait l'utilisateur sur une URL inconnue. Le
      # deploiement echoue ; sur un autre ref le controle est saute, donc y
      # redemarrer ne diagnostiquerait rien. Le message renvoie a la liste des
      # hotes attribues, affichee juste au-dessus dans le resume, et si l'alias
      # n'est jamais attribue, au repli decrit dans la spec (faire porter le
      # deploiement sur une autre ref).
      #
      # Sur un autre ref (workflow_dispatch), l'alias `-git-<branche>-` ne figure
      # pas dans les URIs enregistrees chez Google : la divergence est attendue,
      # documentee, et sans solution automatique. On affiche, sans echec.
      #
      # On ne filtre que des hostnames, jamais la sortie brute de `vercel inspect`.
      - name: Resumer
        working-directory: apps/web
        env:
          REF: ${{ github.ref_name }}
        run: |
          hotes=$(vercel inspect "$URL" --token="$VERCEL_TOKEN" 2>&1 \
            | grep -o '[a-z0-9.-]*\.vercel\.app' | sort -u || true)
          {
            echo "## Preview publiee"
            echo
            echo "- Ref deployee : \`$REF\`"
            echo "- URL unique : $URL"
            echo "- Origine annoncee a Google : $ORIGINE"
            echo
            echo '### Hotes attribues par Vercel'
            echo
            echo '```'
            echo "$hotes"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          # Verification du matching sur `main`.
          if [ "$REF" = "main" ]; then
            hostname=$(echo "$ORIGINE" | sed -e 's|^https\?://||' -e 's|/.*$||')
            if ! echo "$hotes" | grep -qxF "$hostname"; then
              echo "::error::l'alias attendu $hostname n'a pas ete attribue par Vercel. Voir la liste des hotes attribues dans le resume ci-dessus ; si l'alias n'est jamais attribue, appliquer le repli de la spec (faire porter le deploiement sur une autre ref)."
              exit 1
            fi
          fi
