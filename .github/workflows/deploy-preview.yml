name: Deploiement preview

# Le deployeur, et lui seul : `apps/web/vercel.json` a coupe les deploiements de
# l'integration Git. Un merge dans `main` publie ici, en preview, apres CI verte.
#
# `workflow_dispatch` n'a pas d'entree `ref` : le selecteur de branche natif de
# GitHub fait deja le travail, et une entree en plus ferait verifier une branche
# pendant qu'on en deploie une autre. Un dispatch sur une autre branche recoit le
# MEME hote — c'est le domaine de production du projet `homebudget-preview`, il
# suit le dernier deploiement et ne depend pas de la ref — donc la connexion y
# fonctionne, mais la preview de `main` cesse d'etre en ligne jusqu'au prochain
# deploiement. Ce n'est pas une panne, c'est ce qu'on a demande.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Pas d'annulation : `db:migrate` est la seule etape non idempotente de la
# chaine, et deux runs concurrents sur la meme base sont la seule facon de la
# corrompre. On fait la queue.
concurrency:
  group: preview
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verif:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: verif
    runs-on: ubuntu-latest
    environment: Preview

    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      # Le projet dont la production EST notre preview. Le secret VERCEL_PROJECT_ID
      # ci-dessus vient de l'environment `Preview`, qui surcharge celui du depot :
      # c'est cette surcharge, et elle seule, qui empeche ce workflow de deployer sur
      # la production. L'etape « Confirmer la cible » verifie qu'elle a bien eu lieu.
      PROJET_ATTENDU: homebudget-preview

    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Installer la CLI Vercel
        run: npm install --global vercel@latest

      # Un secret d'environment absent ne vaut pas vide : GitHub retombe en silence
      # sur celui du depot, qui designe le projet de PRODUCTION. Le workflow
      # ecraserait alors la DATABASE_URL de la production avec celle de la base de
      # recette, puis y publierait un commit de `main` jamais tagge.
      #
      # Le controle d'alias, en fin de course, verrait la promotion — mais apres
      # coup, et il ne verrait rien de la variable ecrasee. Cette garde passe donc
      # avant `vercel pull`, la premiere commande qui parle a Vercel.
      #
      # Le code HTTP est verifie avant le contenu : sans ca, une reponse 403 donnerait
      # un `name` vide et un message d'erreur qui parlerait du mauvais probleme.
      #
      # Seul `.name` est extrait de la reponse, et le corps n'est jamais affiche : les
      # logs d'un depot public se lisent sans compte.
      - name: Confirmer la cible
        run: |
          code=$(curl -sS -o projet.json -w '%{http_code}' \
            "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID?teamId=$VERCEL_ORG_ID" \
            -H "Authorization: Bearer $VERCEL_TOKEN")
          if [ "$code" != "200" ]; then
            echo "::error::la lecture du projet Vercel a repondu $code ($(jq -r '.error.code // "sans code"' projet.json)). Impossible de confirmer que ce run ne visera pas la production : rien n'a ete deploye."
            rm -f projet.json
            exit 1
          fi
          nom=$(jq -r '.name' projet.json)
          rm -f projet.json
          if [ "$nom" != "$PROJET_ATTENDU" ]; then
            echo "::error::VERCEL_PROJECT_ID designe le projet '$nom' et non '$PROJET_ATTENDU'. Le secret VERCEL_PROJECT_ID de l'environment Preview est probablement absent : GitHub retombe alors sur celui du depot, qui designe la production. Rien n'a ete deploye."
            exit 1
          fi

      # La CLI tourne a la racine du depot, et non dans `apps/web` : le Root
      # Directory du projet vaut `apps/web`, et la CLI le *joint* au repertoire
      # courant. Lancee depuis `apps/web`, elle cherche `apps/web/apps/web`.
      # `vercel build` s'en tire par un repli assorti d'un avertissement,
      # `vercel deploy --prebuilt` echoue net. Tout ce que la CLI ecrit —
      # `.vercel/project.json`, le fichier d'environnement, `.vercel/output` —
      # atterrit donc a la racine, et les etapes qui le lisent aussi.
      - name: Tirer la configuration et les variables de Preview
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      # Sans BETTER_AUTH_URL dans l'environnement Production du projet
      # homebudget-preview, `next build` echoue : `origineAuth()` refuse de
      # demarrer sur Vercel plutot que de retomber sur `localhost`, et c'est
      # voulu — cette URI est enregistree chez Google, donc le tour OAuth
      # reussirait et renverrait l'utilisateur sur son propre poste, sans
      # aucune erreur.
      #
      # Cette garde ne change pas le verdict, elle le rend lisible tout de suite
      # au lieu de deux minutes plus tard dans une stacktrace de build. Le
      # fichier tire contient aussi DATABASE_URL et GOOGLE_CLIENT_SECRET : on
      # n'en extrait que cette seule variable.
      - name: Lire l'origine annoncee a Google
        run: |
          origine=$(grep -m1 '^BETTER_AUTH_URL=' .vercel/.env.production.local | cut -d= -f2- | tr -d '"' || true)
          if [ -z "$origine" ]; then
            echo "::error::BETTER_AUTH_URL est absente de l'environnement Production du projet homebudget-preview. Posez-y le domaine de production de ce projet, le meme que le redirect URI enregistre chez Google."
            exit 1
          fi
          echo "ORIGINE=$origine" >> "$GITHUB_ENV"

      # Il n'y a plus deux sources pour une seule base. Le secret d'environment
      # GitHub est la seule, et cette etape la recopie dans le projet Vercel, que
      # `vercel deploy` capture en creant le deploiement. La migration et
      # l'application ne peuvent plus viser deux bases differentes — par
      # construction, et non plus par verification.
      #
      # Une verification vivait ici, et elle ne pouvait pas fonctionner :
      # `DATABASE_URL` est marquee *Sensitive* cote Vercel, donc `vercel pull` en
      # ecrit la chaine `[SENSITIVE]` et jamais la valeur. Elle comparait une
      # empreinte reelle a une constante, et echouait a chaque run.
      #
      # On passe par l'API, et non par `vercel env add`. La CLI a tourne ici, en
      # production, et n'a rien ecrit : malgre `--yes`, elle demande
      #
      #     Leave empty to apply to all Preview branches.
      #     ? Git branch?
      #
      # Le pipe fournit la valeur puis EOF, la CLI abandonne — et sort en 0.
      # L'etape s'est declaree verte pendant que l'application continuait de
      # parler a l'ancienne base, jusqu'a un `ENOTFOUND` a l'execution. Le code
      # HTTP est verifie pour cette raison : une commande peut mentir.
      #
      # `upsert=true` ecrase en une seule operation : un DELETE puis un POST
      # laisserait l'application sans base si le run mourait entre les deux.
      # `type: sensitive` preserve la protection de la valeur, qui passe par
      # stdin et jamais par la ligne de commande.
      #
      # Le corps de la reponse n'est jamais affiche : il contient la valeur. Seul
      # le code d'erreur en est extrait.
      #
      # Le secret vise la base de PREVIEW, qui doit etre distincte de la
      # production : une preview branchee sur la prod y creerait de vraies
      # depenses et de vraies versions de config. La cible Vercel, elle, est
      # `production` — celle du projet miroir, dont la production est notre preview.
      - name: Aligner DATABASE_URL sur le secret GitHub
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL est absente de l'environment Preview du depot. Sans elle, cette etape effacerait la base que sert l'application."
            exit 1
          fi
          code=$(jq -n --arg v "$DATABASE_URL" \
              '{key:"DATABASE_URL", value:$v, type:"sensitive", target:["production"]}' \
            | curl -sS -o reponse.json -w '%{http_code}' -X POST \
                "https://api.vercel.com/v10/projects/$VERCEL_PROJECT_ID/env?upsert=true&teamId=$VERCEL_ORG_ID" \
                -H "Authorization: Bearer $VERCEL_TOKEN" \
                -H 'Content-Type: application/json' \
                --data @-)
          if [ "$code" != "200" ] && [ "$code" != "201" ]; then
            echo "::error::l'ecriture de DATABASE_URL dans le projet Vercel a repondu $code ($(jq -r '.error.code // "sans code"' reponse.json)). L'application viserait une autre base que la migration."
            exit 1
          fi
          rm -f reponse.json

      - name: Construire
        run: vercel build --prod --token="$VERCEL_TOKEN"

      # L'ordre n'est pas negociable : rien ne s'ecrit sur la base avant qu'un
      # artefact existe, et la migration precede toujours la promotion, afin que le
      # code neuf ne parle jamais a un schema vieux. Elle porte sur la base de
      # PREVIEW : `DATABASE_URL` vient du secret de l'environment `Preview`, qui
      # doit pointer une autre base que la production.
      - name: Migrer la base de preview
        run: pnpm --filter @homebudget/db db:migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Publier
        run: |
          url=$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")
          echo "URL=$url" >> "$GITHUB_ENV"

      # L'hote attendu est le domaine de production du projet `homebudget-preview`,
      # que Vercel attribue au projet et non a l'auteur du deploiement. Il doit
      # figurer parmi les hotes du deploiement : sinon le tour OAuth est casse, la
      # connexion Google renvoyant l'utilisateur sur une URL inconnue.
      #
      # Ce controle a change de nature en changeant de solution. Il verifiait qu'un
      # hote *subi* — l'alias d'auteur, que Vercel fabriquait a partir du nom du
      # compte deployeur — ressemblait a ce qu'on attendait. Il verifie maintenant
      # que l'hote *demande* a bien ete attribue.
      #
      # Il vaut sur n'importe quelle ref. Un garde-fou `if [ "$REF" = "main" ]`
      # vivait ici, parce qu'on croyait l'hote fabrique a partir de la ref ; le
      # premier run reel a dementi la croyance, et le domaine du projet n'en depend
      # pas davantage.
      #
      # Consequence pour un `workflow_dispatch` sur une autre branche : le controle
      # passe, mais la preview de `main` n'est plus en ligne — le domaine suit le
      # dernier deploiement. Rien a verifier la-dessus, c'est ce qu'on a demande.
      #
      # On ne filtre que des hostnames, jamais la sortie brute de `vercel inspect`.
      - name: Resumer
        env:
          REF: ${{ github.ref_name }}
        run: |
          hotes=$(vercel inspect "$URL" --token="$VERCEL_TOKEN" 2>&1 \
            | grep -o '[a-z0-9.-]*\.vercel\.app' | sort -u || true)
          {
            echo "## Preview publiee"
            echo
            echo "- Ref deployee : \`$REF\`"
            echo "- URL unique : $URL"
            echo "- Origine annoncee a Google : $ORIGINE"
            echo
            echo '### Hotes attribues par Vercel'
            echo
            echo '```'
            echo "$hotes"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          # L'origine annoncee a Google doit figurer parmi les hotes attribues.
          hostname=$(echo "$ORIGINE" | sed -e 's|^https\?://||' -e 's|/.*$||')
          if ! echo "$hotes" | grep -qxF "$hostname"; then
            echo "::error::l'hote attendu $hostname n'a pas ete attribue par Vercel. Voir la liste des hotes attribues dans le resume ci-dessus. Verifier que le projet homebudget-preview n'a pas ete renomme, et que BETTER_AUTH_URL porte bien son domaine de production."
            exit 1
          fi
