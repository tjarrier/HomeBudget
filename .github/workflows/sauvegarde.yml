name: Sauvegarde de la production

# Pourquoi et comment : CLAUDE.md, section « Sauvegarde ». Ici, seulement ce que
# le fichier ne dit pas de lui-meme.
#
# GitHub DESACTIVE un workflow planifie apres 60 jours sans activite sur le
# depot. Il ecrit a l'auteur des qu'un run planifie echoue : pas d'alerting a
# construire.
on:
  schedule:
    # Minute non ronde : GitHub retarde les crons de debut d'heure.
    - cron: '17 2 * * *'
  workflow_dispatch:

concurrency:
  group: sauvegarde
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sauvegarder:
    runs-on: ubuntu-latest

    # AUCUN environment, deliberement : `Production` exige un reviewer, et un run
    # planifie resterait en attente chaque nuit jusqu'a expirer. Les deux secrets
    # sont donc ceux du depot — contrepartie assumee, leur valeur est lisible par
    # tout workflow.

    # La copie : elle vit et meurt avec le run.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: homebudget
          POSTGRES_PASSWORD: homebudget
          POSTGRES_DB: homebudget
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U homebudget"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15

    env:
      URL_COPIE: postgresql://homebudget:homebudget@127.0.0.1:5433/homebudget

    steps:
      - uses: actions/checkout@v7

      # `pg_dump` ne passe pas le pooler Supabase en mode transaction (6543), et
      # la connexion directe est en IPv6 seul, injoignable depuis un runner. On
      # derive le port plutot que d'ajouter un second secret pour une seule base.
      #
      # `add-mask` n'est pas cosmetique : GitHub masque le secret, pas la valeur
      # DERIVEE. Sans lui, un port modifie publie les identifiants de la
      # production dans les logs d'un depot public.
      - name: Deriver l'URL de production et nommer la sauvegarde
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL est absente des secrets du depot. Rien a sauvegarder."
            exit 1
          fi
          session=$(printf '%s' "$DATABASE_URL" | sed -E 's#(@[^/@]+):6543#\1:5432#')
          echo "::add-mask::$session"
          echo "URL_PROD=$session" >> "$GITHUB_ENV"
          echo "FICHIER=homebudget-$(date -u +%F).sql.gz.gpg" >> "$GITHUB_ENV"

      - name: Sauvegarder et chiffrer
        env:
          DATABASE_URL: ${{ env.URL_PROD }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: ./scripts/sauvegarder.sh "$FICHIER"

      # Le coeur : on ne suppose jamais qu'un dump est restaurable, on le
      # restaure. Meme script que `task db:restaurer`.
      - name: Restaurer dans le Postgres vierge du run
        env:
          DATABASE_URL: ${{ env.URL_COPIE }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: ./scripts/restaurer.sh "$FICHIER"

      # Les empreintes ne sont JAMAIS affichees : elles portent des montants, et
      # les logs d'un depot public se lisent sans compte. En cas d'ecart, le run
      # ne donne que le nombre de lignes qui divergent — de quoi savoir qu'il
      # faut regarder, sans rien publier.
      - name: Comparer l'empreinte de la production et de la copie
        run: |
          ./scripts/empreinte.sh "$URL_PROD" > empreinte-prod.csv
          ./scripts/empreinte.sh "$URL_COPIE" > empreinte-copie.csv

          if ! diff -q empreinte-prod.csv empreinte-copie.csv > /dev/null; then
            ecarts=$(diff empreinte-prod.csv empreinte-copie.csv | grep -c '^[<>]' || true)
            echo "::error::La copie restauree ne correspond pas a la production : $ecarts ligne(s) d'ecart. Les empreintes ne sont pas affichees (elles contiennent des montants) — rejoue \`scripts/empreinte.sh\` en local sur les deux bases. L'artefact n'est PAS publie."
            exit 1
          fi

          {
            echo "## Sauvegarde verifiee"
            echo
            echo "- Fichier : \`$FICHIER\` ($(du -h "$FICHIER" | cut -f1), chiffre AES256)"
            echo "- Tables comparees : $(grep -cE '^(public|drizzle),' empreinte-prod.csv)"
            echo "- Empreinte production et copie restauree : identiques"
          } >> "$GITHUB_STEP_SUMMARY"

      # En dernier, et seulement si la comparaison est passee. Le chemin est un
      # motif `.gpg` et non un nom de fichier : publier un `.sql` par erreur
      # devient impossible. 90 jours est le maximum offert par GitHub.
      - name: Publier la sauvegarde
        uses: actions/upload-artifact@v7
        with:
          name: sauvegarde-chiffree
          path: homebudget-*.sql.gz.gpg
          retention-days: 90
          if-no-files-found: error
